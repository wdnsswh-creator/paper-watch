name: Zotero Language Template

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zotero-language-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Zotero language template
        run: |
          python scripts/generate_zotero_language_template.py

      - name: Commit Zotero language template
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add outputs/
          git commit -m "Generate Zotero literature language template" || echo "No changes to commit"
          git push
