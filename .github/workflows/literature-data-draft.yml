name: Literature Data Draft

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/literature-data-draft.yml"

permissions:
  contents: write

jobs:
  literature-data-draft:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas openpyxl xlrd

      - name: Generate literature data draft
        run: |
          python scripts/generate_literature_data_draft.py

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add outputs/
          git commit -m "Generate literature data analysis draft" || echo "No changes to commit"
          git push
